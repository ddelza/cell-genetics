<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>판다로 확인하는 멘델의 유전법칙 — 세포분열과 유전 표현하기</title>
<link rel="stylesheet" href="common.css?v=5">
<style>
.floor { display: grid; grid-template-columns: 64px 1fr; gap: 4px 10px; font-size: 0.82rem; line-height: 1.55; margin: 8px 0; }
.floor b { color: var(--accent); }
.cg-practice-note { background: #fff9db; border: 1.5px solid #ffe066; border-radius: 12px; padding: 10px 14px; font-size: 0.86rem; line-height: 1.6; margin-bottom: 12px; }
.cg-fb { margin-top: 6px; background: #e7f5ff; border-left: 4px solid #1c7ed6; border-radius: 8px; padding: 7px 10px; font-size: 0.84rem; line-height: 1.55; white-space: pre-wrap; }
.cg-fb b { color: #1864ab; }
.cg-fb-sum { background: #e7f5ff; border-radius: 12px; padding: 9px 14px; font-size: 0.86rem; margin-bottom: 12px; color: #1864ab; }
.gene { font-family: Consolas, monospace; font-weight: 700; background: #f2f4fa; border-radius: 4px; padding: 0 4px; }
</style>
</head>
<body>
<div class="wrap">
  <div id="dc-head"></div>
  <div class="cg-practice-note">✏️ <b>여기는 연습장이에요.</b> 여기에 쓴 답은 점수에 들어가지 않고, 선생님이 읽고 <b>피드백</b>을 달아 주세요.<br>
    실제 점수는 수업 시간에 <b>구글폼 실전 논술(시험 모드)</b>로 매겨요. 실전에서는 판다쌤과 이 페이지를 볼 수 없으니, 연습하면서 내 말로 정리해 두세요.</div>
  <div id="fbSummary"></div>
  <div id="form"></div>
</div>

<script src="session.js?v=5"></script>
<script src="cg.js?v=6"></script>
<script src="coach.js?v=5"></script>
<script>
const GAME = '<div class="concept"><h3>🐼 판다의 유전 (마인크래프트) 다시 보기</h3>' +
  '<div class="floor">' +
  '<b>4층</b><div>할아버지·할머니 판다 = <b>어버이(순종)</b> — 검정 판다 <span class="gene">BB</span> × 갈색 판다 <span class="gene">bb</span></div>' +
  '<b>3층</b><div>부모 판다 = <b>자손 1대(잡종)</b> <span class="gene">Bb</span> — 서로 교배시켜 아기 판다를 만듦</div>' +
  '<b>1층·바깥</b><div>아기 판다 = <b>자손 2대(??)</b> — 색(검정/갈색)에 따라 분류해서 셈</div>' +
  '</div><p class="dc-muted" style="margin:0">모둠 기록지를 보면서 결과를 옮겨 적고, 모둠 토의 내용을 바탕으로 <b>내 생각을 내 말로</b> 써요.</p></div>';

const N = v => (v === '' || v === null || v === undefined || isNaN(+v)) ? null : +v;
function ratioText(b, r) {
  b = N(b); r = N(r);
  if (b === null || r === null) return '-';
  if (r === 0) return b > 0 ? '갈색 0' : '-';
  return (b / r).toFixed(2) + ' (약 ' + (Math.round(b / r * 10) / 10) + ' : 1)';
}

// ---------- 모의 실험 결과표 ----------
// 우리 모둠 결과는 모둠원 한 명만 입력하면 공유된다: pandaResult/{반}/{모둠} = { black, brown, lastEditorName, updatedAt }
// 반 전체·전교는 지금까지 입력된 모둠 결과를 자동으로 더한다. 모둠 배정은 교사가 한다: pandaTeam/{반}/{학번} = { group }
const R = { ban: '', team: null, members: [], all: {}, loadedAt: 0, ready: false };
const RESULT_BOX = '<label class="field-label">모의 실험 결과 (자손 2대 아기 판다 수)</label>' +
  '<div class="dc-hint">잘못 분류된 판다도 색을 잘 보고 포함해서 센 결과를 적어요. <b>우리 모둠 결과는 모둠에서 한 명만 입력</b>하면 모둠원 모두에게 공유되고, 반 전체·전교는 입력된 결과가 자동으로 합산돼요.</div>' +
  '<div id="resultBox"><div class="loading-state">불러오는 중...</div></div>';

function sumOf(groups) {
  let b = 0, r = 0, n = 0;
  Object.values(groups || {}).forEach(x => { if (x && N(x.black) !== null && N(x.brown) !== null) { b += +x.black; r += +x.brown; n++; } });
  return { b, r, n };
}
function totals() {
  const all = R.all || {};
  const cls = sumOf(all[R.ban]);
  // 전교: 실제 반만 합산(교사 테스트 반 'T'는 테스트 중일 때만 포함)
  const bans = Object.keys(all).filter(k => k !== 'T' || R.ban === 'T');
  let b = 0, r = 0, n = 0, nb = 0;
  bans.forEach(k => { const t = sumOf(all[k]); if (t.n) { b += t.b; r += t.r; n += t.n; nb++; } });
  return { cls, school: { b, r, n, nb } };
}
const mine = () => R.team && R.all[R.ban] ? R.all[R.ban][R.team] : null;

function renderResultTable() {
  const box = document.getElementById('resultBox'); if (!box) return;
  const dis = R.team ? '' : ' disabled';
  box.innerHTML = '<table class="cg-table"><tr><th></th><th>검정</th><th>갈색</th><th>검정 ÷ 갈색</th></tr>' +
    '<tr><th>우리 모둠<small id="rgNote"></small></th>' +
    `<td><input type="number" min="0" inputmode="numeric" id="rgB"${dis}></td><td><input type="number" min="0" inputmode="numeric" id="rgR"${dis}></td><td class="ratio" id="rgRatio">-</td></tr>` +
    '<tr><th>반 전체<small id="rcNote"></small></th><td id="rcB">-</td><td id="rcR">-</td><td class="ratio" id="rcRatio">-</td></tr>' +
    '<tr><th>전교<small id="rsNote"></small></th><td id="rsB">-</td><td id="rsR">-</td><td class="ratio" id="rsRatio">-</td></tr></table>' +
    (R.team ? '<div class="error-msg" id="rgErr"></div><div class="ok-msg" id="rgOk"></div><button class="btn small" id="rgSave" style="margin-top:8px">💾 우리 모둠 결과 저장 (모둠원 모두에게 공유)</button>'
      : '<div class="dc-locked" style="margin-top:8px">선생님이 아직 판다 모둠을 배정하지 않았어요. 배정되면 우리 모둠 결과를 입력할 수 있어요.</div>');
  ['rgB', 'rgR'].forEach(id => document.getElementById(id).addEventListener('input', () => {
    document.getElementById('rgRatio').textContent = ratioText(document.getElementById('rgB').value, document.getElementById('rgR').value);
  }));
  if (R.team) document.getElementById('rgSave').onclick = saveTeamResult;
  syncInputs(true);
  refreshTotals();
}

// 서버 값을 입력칸에 반영 — 학생이 고치는 중인 칸(서버 값과 다르게 바꾼 칸)은 건드리지 않는다.
function syncInputs(force) {
  const m = mine() || {};
  [['rgB', m.black], ['rgR', m.brown]].forEach(([id, v]) => {
    const el = document.getElementById(id); if (!el) return;
    const sv = v === undefined || v === null ? '' : String(v);
    if (force || (el.value === (el.dataset.server ?? '') && document.activeElement !== el)) el.value = sv;
    el.dataset.server = sv;
  });
  const g = document.getElementById('rgB');
  if (g) document.getElementById('rgRatio').textContent = ratioText(g.value, document.getElementById('rgR').value);
}
function refreshTotals() {
  if (!document.getElementById('rcB')) return;
  const m = mine();
  document.getElementById('rgNote').innerHTML = R.team
    ? `${R.team}모둠 · ${m ? `${DC.esc(m.lastEditorName || '')} 입력 ${DC.fmtTime(m.updatedAt)}` : '아직 입력 전'}` + (R.members.length ? `<br>${DC.esc(R.members.join(', '))}` : '')
    : '모둠 배정 전';
  const t = totals();
  [['c', t.cls, `${t.cls.n}개 모둠 합계`], ['s', t.school, `${t.school.nb}개 반 · ${t.school.n}개 모둠 합계`]].forEach(([k, v, note]) => {
    document.getElementById(`r${k}B`).textContent = v.n ? v.b : '-';
    document.getElementById(`r${k}R`).textContent = v.n ? v.r : '-';
    document.getElementById(`r${k}Ratio`).textContent = v.n ? ratioText(v.b, v.r) : '-';
    document.getElementById(`r${k}Note`).textContent = v.n ? `지금까지 ${note}` : '아직 입력된 모둠 없음';
  });
}

async function saveTeamResult() {
  const err = document.getElementById('rgErr'), ok = document.getElementById('rgOk');
  err.classList.remove('show'); ok.classList.remove('show');
  const b = N(document.getElementById('rgB').value), r = N(document.getElementById('rgR').value);
  if (b === null || r === null || b < 0 || r < 0) { err.textContent = '검정·갈색 판다 수를 모두 0 이상의 숫자로 적어 주세요.'; err.classList.add('show'); return; }
  const btn = document.getElementById('rgSave');
  btn.disabled = true;
  try {
    const path = `pandaResult/${R.ban}/${R.team}`;
    const cur = await DC.get(path).catch(() => null);
    if (cur && cur.updatedAt && cur.updatedAt !== R.loadedAt && (cur.black !== b || cur.brown !== r) &&
      !confirm(`그 사이 ${cur.lastEditorName || '다른 모둠원'}이(가) 우리 모둠 결과를 검정 ${cur.black} / 갈색 ${cur.brown}(으)로 저장했어요.\n내가 쓴 검정 ${b} / 갈색 ${r}(으)로 바꿀까요?`)) {
      await loadResults(true); return;
    }
    const rec = { black: b, brown: r, lastEditor: DC.student.id, lastEditorName: DC.student.name, updatedAt: Date.now() };
    await DC.put(path, rec);
    R.all[R.ban] = R.all[R.ban] || {}; R.all[R.ban][R.team] = rec; R.loadedAt = rec.updatedAt;
    syncInputs(true); refreshTotals();
    ok.textContent = '저장되었어요! 모둠원 화면에도 바로 보여요.'; ok.classList.add('show');
  } catch (e) {
    err.textContent = e.message + ' — 다시 눌러 주세요.'; err.classList.add('show');
  } finally { btn.disabled = false; }
}

// 선생님 피드백: pandaFb/{반}/{학번}/{q1~q5|counts|all} = { text, updatedAt } (teacher.html에서 작성)
const FB_LABEL = { counts: '모의 실험 결과', q1: '1번', q2: '2번', q3: '3번', q4: '4번', q5: '5번', all: '전체' };
async function showFeedback() {
  const fb = (await DC.get(`pandaFb/${DC.myBan()}/${DC.student.id}`).catch(() => null)) || {};
  const keys = Object.keys(fb).filter(k => fb[k] && fb[k].text);
  document.getElementById('fbSummary').innerHTML = keys.length
    ? `<div class="cg-fb-sum">💬 선생님 피드백이 <b>${keys.length}개</b> 있어요. 각 문항 아래 파란 상자를 확인하세요.${fb.all && fb.all.text ? `<div class="cg-fb" style="margin-top:6px"><b>전체</b> · ${DC.fmtTime(fb.all.updatedAt)}
${DC.esc(fb.all.text)}</div>` : ''}</div>` : '';
  keys.filter(k => k !== 'all').forEach(k => {
    const box = k === 'counts' ? document.getElementById('resultBox') : document.querySelector(`[data-fid="${k}"]`);
    if (!box) return;

    const d = document.createElement('div');
    d.className = 'cg-fb';
    d.innerHTML = `<b>💬 선생님 피드백 (${FB_LABEL[k]})</b> · ${DC.fmtTime(fb[k].updatedAt)}
${DC.esc(fb[k].text)}`;
    if (k === 'counts') box.insertAdjacentElement('afterend', d); // resultBox 안은 결과표가 다시 그려지므로 바깥에
    else (box.closest('.cg-q') || box.parentElement).appendChild(d);
  });
}

async function loadTeam() {
  const t = (await DC.get(`pandaTeam/${R.ban}`).catch(() => null)) || {};
  const my = t[DC.student.id];
  const team = my && my.group ? +my.group : null;
  R.members = team ? Object.values(t).filter(x => x && +x.group === team).sort((a, b) => (a.num || 0) - (b.num || 0)).map(x => x.name) : [];
  const changed = team !== R.team || !R.ready;
  R.team = team; R.ready = true;
  if (changed) renderResultTable(); else refreshTotals();
}
async function loadResults(force) {
  R.all = (await DC.get('pandaResult').catch(() => null)) || {};
  const m = mine(); R.loadedAt = m ? m.updatedAt : 0;
  syncInputs(force); refreshTotals();
}

const RUBRIC = [
  ['모의 활동에 유전 법칙 적용하기 (3점)', [
    [3, '모의 활동이나 사례 분석을 통해 멘델의 유전 법칙이 자손의 형질 결정에 어떻게 작용하는지 논리적 인과관계를 입증함.'],
    [2, '유전 법칙의 개념은 이해하고 있으나, 이를 탐구 데이터와 연결하여 설명하는 논리가 다소 개략적임.'],
    [1, '유전 법칙의 개념에 대한 이해가 다소 부족하며 모의 활동과의 연결이 미흡함.'],
  ]],
  ['모의 활동 결과 해석하기 (2점)', [
    [2, '모의 활동을 통해 얻은 수치 데이터를 정리하고, 멘델의 유전 원리에 따른 기댓값과 비교하여 올바르게 분석함.'],
    [1, '데이터를 정리하였으나, 수치가 가지는 확률적 경향성에 대한 분석이 다소 부족함.'],
  ]],
];
const RUBRIC_HTML = '<details class="cg-rubric"><summary>📋 평가 기준 보기</summary>' +
  RUBRIC.map(([t, rows]) => '<div style="font-weight:700;margin-top:6px">' + t + '</div><table>' +
    rows.map(r => '<tr><td class="pt">' + r[0] + '점</td><td>' + r[1] + '</td></tr>').join('') + '</table>').join('') + '</details>';

const GROUPS = [
  { title: '① 모의 실험 결과 기록하기', fields: [
    { type: 'info', html: GAME },
    { id: 'role', type: 'checks', short: '나의 역할', label: '나의 역할 (맡은 역할을 모두 골라요)', options: ['대장', '판다결혼정보회사직원', '판다유치원교사', '판다양로원직원', '철도공사직원'] },
    { type: 'info', html: RESULT_BOX },
  ] },
  { title: '② 유전의 원리 분석·도출하기 (개인 논술 · 9점)', fields: [
    { type: 'info', html: '<div style="font-size:0.82rem;line-height:1.6">모둠 토의 문항이에요. 토의한 내용을 바탕으로 <b>자기 말로</b> 답을 써요. 수치(판다 수, 비율)를 근거로 들면 더 좋아요.</div>' + RUBRIC_HTML },
    { id: 'q1', type: 'textarea', wrap: true, short: '1. 더 의미 있는 결과와 그 이유', label: '1. 우리 모둠 결과와 반 전체 결과 중, 어떤 결과가 더 의미있을까요? 그 이유는 무엇일까요?' },
    { id: 'q2', type: 'textarea', wrap: true, short: '2. 어버이 순종 교배 설명', label: '2. 어버이 순종 교배에 대해 설명하기', hint: '어떤 판다끼리 교배해서 어떤 판다들이 나왔는지?' },
    { id: 'q3', type: 'textarea', wrap: true, short: '3. 어버이 순종 교배로 추측할 수 있는 것', label: '3. 어버이 순종 판다 교배의 결과로 추측해볼 수 있는 것은?' },
    { id: 'q4', type: 'textarea', wrap: true, rows: 5, short: '4. 자손 1대 잡종 교배 설명', label: '4. 자손 1대 잡종 교배에 대해 설명하기', hint: '어떤 판다끼리 교배해서 어떤 판다들이 나왔는지? ★ 반 전체 결과가 어떤 정수비를 나타내는지에 대한 내용을 반드시 포함해요.' },
    { id: 'q5', type: 'textarea', wrap: true, rows: 5, short: '5. 자손 2대 정수비의 의미', label: '5. 자손 2대 검정 판다와 갈색 판다의 정수비가 갖는 의미는 무엇일까요?' },
  ] },
];

DC.start({ title: '🐼 판다로 확인하는 멘델의 유전법칙', subtitle: '활동 1 · 연습장 (실전은 구글폼 시험 모드)' }).then(() => {
  R.ban = DC.myBan();
  const formApi = DC.form({
    mount: '#form', key: 'panda', groups: GROUPS, saveLabel: '💾 연습 저장하기',
    required: ['q1', 'q2', 'q3', 'q4', 'q5'],
    validate: ans => {
      const gb = document.getElementById('rgB'), gr = document.getElementById('rgR');
      if (gb && (gb.value !== (gb.dataset.server ?? '') || gr.value !== (gr.dataset.server ?? '')))
        return '우리 모둠 결과에 저장하지 않은 숫자가 있어요. 먼저 "우리 모둠 결과 저장"을 눌러 주세요.';
      // 채점 참고용으로 저장 당시의 결과표를 함께 남긴다
      const m = mine() || {}, t = totals();
      ans.team = R.team || '';
      ans.counts = { gb: m.black ?? '', gr: m.brown ?? '', cb: t.cls.n ? t.cls.b : '', cr: t.cls.n ? t.cls.r : '', cn: t.cls.n,
        sb: t.school.n ? t.school.b : '', sr: t.school.n ? t.school.r : '', sn: t.school.n };
      return '';
    },
    onLoad: () => { loadTeam().then(() => loadResults(true)); showFeedback(); },
  });
  Coach.mount({ getDraft: () => formApi.values() });
  // 모둠원·다른 모둠이 결과를 저장하거나 선생님이 모둠을 배정하면 바로 반영
  // (실시간 연결은 1개만 — 모둠 배정은 10초마다 확인)
  const live = DC.listen('pandaResult', () => { loadResults(false); if (R.ready) loadTeam(); });
  setInterval(() => { if (!document.hidden && R.ready) loadTeam(); }, 10000);
  setInterval(() => { if (!document.hidden && R.ready) loadResults(false); }, live ? 30000 : 8000);
});
</script>
</body>
</html>
